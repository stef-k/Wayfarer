# Resolve shared presentation assets during the GitHub Pages build.
remote_theme: stef-k/.github@main

plugins:
  - jekyll-remote-theme

# Project identity and repository-scoped documentation URL.
title: Wayfarer
description: Self-hosted location timeline, trip planning and live sharing.
url: https://stef-k.github.io
baseurl: /Wayfarer
repository: stef-k/Wayfarer

# All documentation pages use the small local navigation wrapper.
defaults:
  - scope:
      path: ""
    values:
      layout: documentation
