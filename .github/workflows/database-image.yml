name: Database image publication

# Explicit DB-only authorization; this never creates an application release/tag.
on:
  workflow_dispatch:
    inputs:
      source:
        description: Full reviewed source SHA (must equal the selected workflow ref)
        required: true
        type: string
      db_version:
        description: Reviewed database package identity
        required: true
        default: pg17.11-postgis3.6.4-bookworm
        type: string
      digest:
        description: Recovery only; recorded manifest digest skips publication
        required: false
        type: string

permissions:
  contents: read

# All writers use one lock; GHCR has no conditional create-only push API.
concurrency:
  group: wayfarer-db-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'stef-k/Wayfarer' && inputs.digest == ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Require reviewed workflow/source identity
        env:
          SOURCE: ${{ inputs.source }}
        run: test "$SOURCE" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Build and qualify the application companion locally
        run: python3 tools/release/image.py dry-run --output "$RUNNER_TEMP/app.json"
      - name: Authenticate only the publishing client
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Build, fully qualify and publish the DB once
        id: publish
        env:
          SOURCE: ${{ inputs.source }}
          DB_VERSION: ${{ inputs.db_version }}
        run: |
          app_image="$(python3 -c 'import json,os; e=json.load(open(os.environ["RUNNER_TEMP"]+"/app.json")); print(e["image"]+":"+e["tag"])')"
          python3 tools/release/db_image.py publish --source "$SOURCE" --db-version "$DB_VERSION" \
            --app-image "$app_image" --output "$RUNNER_TEMP/db-publication.json"
      - name: Logout publishing client
        if: always()
        run: docker logout ghcr.io
      - name: Preserve pushed identity before anonymous qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-publication
          path: ${{ runner.temp }}/db-publication.json
          if-no-files-found: warn

  anonymous-pull:
    needs: publish
    if: >-
      always() && github.repository == 'stef-k/Wayfarer' &&
      (needs.publish.result == 'success' || (needs.publish.result == 'skipped' && inputs.digest != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Require reviewed workflow/source identity
        env:
          SOURCE: ${{ inputs.source }}
        run: test "$SOURCE" = "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false
      - name: Build and qualify only the application companion
        run: python3 tools/release/image.py dry-run --output "$RUNNER_TEMP/app.json"
      - name: Pull exact DB artifact anonymously and run full Compose qualification
        env:
          SOURCE: ${{ inputs.source }}
          DB_VERSION: ${{ inputs.db_version }}
          DB_DIGEST: ${{ inputs.digest || needs.publish.outputs.digest }}
        run: |
          app_image="$(python3 -c 'import json,os; e=json.load(open(os.environ["RUNNER_TEMP"]+"/app.json")); print(e["image"]+":"+e["tag"])')"
          python3 tools/release/db_image.py qualify --source "$SOURCE" --db-version "$DB_VERSION" \
            --digest "$DB_DIGEST" --app-image "$app_image" --output "$RUNNER_TEMP/db-evidence.json"
      - name: Explain public visibility and recovery gate
        if: failure()
        run: echo 'If GHCR denied anonymous access, set wayfarer-db package visibility to public. Preserve db-publication digest; rerun only this failed job or dispatch recovery with that digest. Never rerun publication or overwrite its identity.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: db-evidence
          path: ${{ runner.temp }}/db-evidence.json
          if-no-files-found: error
