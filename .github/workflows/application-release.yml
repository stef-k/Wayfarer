name: Stable application image

# Only an intentional published stable release authorizes a registry write.
on:
  release:
    types: [published]

permissions:
  contents: read

# Serialize reruns/releases for the same tag; never cancel a publication in flight.
concurrency:
  group: application-image-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'stef-k/Wayfarer' && !github.event.release.draft && !github.event.release.prerelease
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate accepted DB publication evidence before any application publication
        run: python3 -B -c 'import sys; sys.path.insert(0,"tools/release"); import bundle; print(bundle.stable_database_digest())'
      - name: Authenticate only the publishing client
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Validate release, build, qualify and publish once
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: python3 tools/release/image.py publish --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --output "$RUNNER_TEMP/image-publication.json"
      - name: Logout publishing client
        if: always()
        run: docker logout ghcr.io
      - name: Preserve published digest even if qualification is incomplete
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-publication-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-publication.json
          if-no-files-found: warn

  # A fresh runner and empty Docker config prove distribution without publisher credentials.
  anonymous-pull:
    needs: publish
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: image-publication-${{ matrix.arch }}
          path: ${{ runner.temp }}/publication
      - name: Read this platform's retained pushed digest
        id: publication
        run: python3 -c 'import json,os; print("digest="+json.load(open(os.environ["RUNNER_TEMP"]+"/publication/image-publication.json"))["platformDigest"])' >> "$GITHUB_OUTPUT"
      - name: Pull and qualify exactly the published digest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SOURCE: ${{ github.sha }}
          IMAGE_DIGEST: ${{ steps.publication.outputs.digest }}
        run: python3 tools/release/image.py qualify --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --digest "$IMAGE_DIGEST" --output "$RUNNER_TEMP/image-evidence-${{ matrix.arch }}.json"
      - name: Explain public visibility gate
        if: failure()
        run: echo 'Anonymous qualification failed. If GHCR denied access, the maintainer must set the Wayfarer package visibility to public. Preserve the published digest; rerun only this failed job, never rebuild or overwrite the stable tag.'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-evidence-${{ matrix.arch }}.json
          if-no-files-found: error

  # A single stable tag binds the two exact native manifests after both anonymous gates.
  publish-index:
    needs: anonymous-pull
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.index.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: image-evidence-*
          merge-multiple: true
          path: ${{ runner.temp }}/platforms
      - name: Authenticate only the index publishing client
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Publish one immutable release index from already qualified digests
        id: index
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SOURCE: ${{ github.sha }}
        run: python3 tools/release/image.py index --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" --inputs "$RUNNER_TEMP/platforms" --output "$RUNNER_TEMP/image-index.json"
      - name: Logout index publishing client
        if: always()
        run: docker logout ghcr.io
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: image-index
          path: ${{ runner.temp }}/image-index.json
          if-no-files-found: warn

  # Only this job can create Release assets; package publication remains in its existing job.
  deployment-bundle:
    needs: [publish-index, anonymous-pull]
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Pull accepted exact dependencies anonymously
        env:
          IMAGE_DIGEST: ${{ needs.publish-index.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          mkdir -m 700 "$DOCKER_CONFIG"
          platform=linux/${{ matrix.arch }}
          app_digest="$(python3 -B -c 'import sys; sys.path.insert(0,"tools/release"); import image; print(image.selected_digest(sys.argv[1]))' "ghcr.io/stef-k/wayfarer@$IMAGE_DIGEST")"
          db_digest="$(python3 -B -c 'import sys; sys.path.insert(0,"tools/release"); import bundle; print(bundle.stable_database_digest())')"
          docker pull --platform "$platform" "ghcr.io/stef-k/wayfarer@$app_digest"
          docker pull --platform "$platform" "ghcr.io/stef-k/wayfarer-db@$db_digest"
          docker pull --platform "$platform" caddy@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
      - name: Assemble, validate and upload stable assets once
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_SOURCE: ${{ github.sha }}
          IMAGE_DIGEST: ${{ needs.publish-index.outputs.digest }}
          DOCKER_CONFIG: ${{ runner.temp }}/anonymous-docker
        run: |
          python3 -B tools/release/bundle.py --stable --publish --tag "$RELEASE_TAG" --source "$RELEASE_SOURCE" \
            --app-digest "$IMAGE_DIGEST" --output "$RUNNER_TEMP/deployment"
      - name: Retain intended bytes and publication provenance for reconciliation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-publication-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/deployment/*.tar.gz
            ${{ runner.temp }}/deployment/*.sha256
            ${{ runner.temp }}/deployment/publication.json
            ${{ runner.temp }}/deployment/v*/release.json
            ${{ runner.temp }}/deployment/v*/wayfarerctl
          if-no-files-found: warn

      - name: Retain publication evidence without executable payloads
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deployment-publication-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/deployment/publication.json
          if-no-files-found: warn

  # Operational acceptance runs only for a genuine stable release, on a fresh unauthenticated Docker client.
  public-compose-acceptance:
    needs: deployment-bundle
    strategy:
      # Each native installation retains its own outcome and diagnostics even if the other fails.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deployment-publication-evidence-${{ matrix.arch }}
          path: ${{ runner.temp }}/publication
      - name: Install from the public lean bootstrap, then exercise fresh setup and doctor
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          # Retained publication evidence supplies expected digests, never an executable or deployment input.
          # The native fresh runner obtains only the public bootstrap; setup discovers the public bundle anonymously.
          sudo install -d -m 700 /tmp/wayfarer-public-acceptance
          asset=wayfarerctl-linux-${{ matrix.arch }}.tar.gz
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 600 \
            --output "$RUNNER_TEMP/$asset" "https://github.com/stef-k/Wayfarer/releases/download/$RELEASE_TAG/$asset"
          expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["assets"][sys.argv[2]].removeprefix("sha256:"))' "$RUNNER_TEMP/publication/publication.json" "$asset")"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$asset" | sha256sum --check
          sudo install -d -m 700 /tmp/wayfarer-public-acceptance/bootstrap
          sudo tar --extract --gzip --file "$RUNNER_TEMP/$asset" --directory /tmp/wayfarer-public-acceptance/bootstrap --no-same-owner
          bootstrap=/tmp/wayfarer-public-acceptance/bootstrap/wayfarerctl
          sudo chmod 555 "$bootstrap"
          # A disposable root-only stdin file follows the shipped protected-password convention.
          sudo sh -c 'umask 077; printf "Acceptance-Aa1!%s\n" "$(openssl rand -hex 16)" > /tmp/wayfarer-public-acceptance/password'
          # No --bundle, --version or digest injection: this is the ordinary latest-stable setup route.
          # Both operator streams are sanitized; captured child stderr and protected stdin remain suppressed.
          sudo sh -c 'exec "$1" --deployment-root /tmp/wayfarer-public-acceptance/install setup --hostname wayfarer.example.org --project wayfarer-public-acceptance --edge-prefix 172.30.69 --mode external --loopback-port 18080 --password-stdin < /tmp/wayfarer-public-acceptance/password' sh "$bootstrap" 2>&1 | tee "$RUNNER_TEMP/setup.log"
          bundle="/tmp/wayfarer-public-acceptance/install/releases/$RELEASE_TAG"
          sudo cmp "$bootstrap" "$bundle/wayfarerctl"
          sudo "$bootstrap" --deployment-root /tmp/wayfarer-public-acceptance/install dispatch release inspect "$bundle" | tee "$RUNNER_TEMP/acquisition.json"
          sudo "$bootstrap" --deployment-root /tmp/wayfarer-public-acceptance/install dispatch doctor
          sudo "$bootstrap" --deployment-root /tmp/wayfarer-public-acceptance/install dispatch stop
      - name: Preserve real public acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-compose-acceptance-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/acquisition.json
            ${{ runner.temp }}/setup.log
          if-no-files-found: warn
