# Isolated #858 prototype: explicit codec routes and locked, minimal image features.
[package]
name = "wayfarer-image"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[features]
# The research archive's selected safe pipeline preserves all integrated gains.
default = ["jpeg-candidate-decode", "native-jpeg-encode"]
# Opt-in fixed stage labels reuse the retained diagnosis probes; normal builds emit no timings.
diagnostic-timing = []
# Codec-only observations include rejected allocating paths; never used by the CLI.
codec-bench = ["dep:libjpeg-turbo-rs", "dep:webp", "dep:libwebp-sys"]
# Independent decode-only CLI candidates retain the accepted output encoders.
jpeg-candidate-decode = ["dep:libjpeg-turbo-rs"]
webp-candidate-decode = ["dep:webp", "dep:libwebp-sys"]
# Final bounded native encoder trial; selected only after its behavioral/resource checks.
native-jpeg-encode = ["dep:turbojpeg", "dep:turbojpeg-sys"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
# RGB8 Lanczos3 uses runtime-dispatched SIMD, without a thread pool or image adapter.
fast_image_resize = { version = "=6.1.0", default-features = false, features = ["std"] }
jpeg-decoder = { version = "=0.3.2", default-features = false }
png = "=0.18.1"
gif = "=0.14.2"
image-webp = "=0.2.4"
moxcms = { version = "=0.8.0", features = ["lut"] }
libc = "=0.2.177"
# AVX2 is runtime-dispatched on x86; other CPUs and architectures retain scalar encoding.
jpeg-encoder = { version = "=0.7.1", features = ["simd"] }
# The exact requested JPEG candidate retains portable runtime SIMD dispatch.
libjpeg-turbo-rs = { version = "=0.8.0", optional = true }
# Disable the image adapter and pin the native dependency selected by webp 0.3.1.
webp = { version = "=0.3.1", default-features = false, optional = true }
libwebp-sys = { version = "=0.9.6", optional = true }
# Use the published safe borrowed-slice API and its exact vendored native implementation.
turbojpeg = { version = "=1.5.1", optional = true }
turbojpeg-sys = { version = "=1.2.0", optional = true }

[[example]]
# The microbenchmark is intentionally absent from ordinary product builds/tests.
name = "codec_bench"
required-features = ["codec-bench"]

[profile.release]
# A decoder panic invalidates the child rather than unwinding through processing.
panic = "abort"
